<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!--
  Tool palette icons.

  Hand-authored and vendored rather than pulled from an icon CDN, for the same
  reason every other asset here is (README: "no CDN calls" - the map has to draw
  with the WAN down). Each is a <symbol> on a 24x24 viewBox using currentColor,
  so one sheet serves the active/inactive/disabled states from CSS rather than
  needing three files.
-->

<!-- Select: the default tool. An arrow cursor, because that is exactly what it
     restores - the map behaving as it always did. -->
<symbol id="nf-tool-select" viewBox="0 0 24 24">
  <path d="M5 3l14 8-6 1.5L10 20z" fill="currentColor" stroke="currentColor"
        stroke-width="1.5" stroke-linejoin="round"/>
</symbol>

<!-- Waypoint: a dropped pin. -->
<symbol id="nf-tool-waypoint" viewBox="0 0 24 24">
  <path d="M12 22s7-7.6 7-12a7 7 0 10-14 0c0 4.4 7 12 7 12z"
        fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="12" cy="10" r="2.5" fill="currentColor"/>
</symbol>

<!-- Area: a polygon with its vertices showing, which is what the tool draws. -->
<symbol id="nf-tool-area" viewBox="0 0 24 24">
  <path d="M4 7l8-4 8 6-3 10H7z" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linejoin="round"/>
  <circle cx="4" cy="7" r="2" fill="currentColor"/>
  <circle cx="12" cy="3" r="2" fill="currentColor"/>
  <circle cx="20" cy="9" r="2" fill="currentColor"/>
  <circle cx="17" cy="19" r="2" fill="currentColor"/>
  <circle cx="7" cy="19" r="2" fill="currentColor"/>
</symbol>

<!-- Measure: a ruler. -->
<symbol id="nf-tool-measure" viewBox="0 0 24 24">
  <rect x="2" y="8" width="20" height="8" rx="1" fill="none" stroke="currentColor"
        stroke-width="2" transform="rotate(-20 12 12)"/>
  <path d="M7 8.5v3M11 7v4M15 5.5v3M19 4v4" stroke="currentColor" stroke-width="1.6"
        transform="rotate(-20 12 12)"/>
</symbol>

<!-- Sketch: a pen nib, for the tactical sketch tool operations.js already owns. -->
<symbol id="nf-tool-sketch" viewBox="0 0 24 24">
  <path d="M3 21l3-8L16 3l5 5-10 10z" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linejoin="round"/>
  <path d="M14 5l5 5" stroke="currentColor" stroke-width="2"/>
</symbol>
</svg>
